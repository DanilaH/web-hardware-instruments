name: Gamepad visual checkpoint

on:
  pull_request:

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Capture review screenshots
        run: |
          mkdir -p visual-check
          python3 -m http.server 4321 --directory dist >/tmp/hardware-tests-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=visual-check/gamepad-390x844.png http://127.0.0.1:4321/gamepad-tester/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1366,768 --screenshot=visual-check/gamepad-1366x768.png http://127.0.0.1:4321/gamepad-tester/
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=visual-check/gamepad-1440x900.png http://127.0.0.1:4321/gamepad-tester/

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: gamepad-visual-check-post-review
          path: visual-check/*.png
