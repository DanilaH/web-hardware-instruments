name: Apply UI review fixes

on:
  push:
    branches:
      - ui-content-driven-stability

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ui-content-driven-stability
      - name: Apply DPI capture-note stability fix
        run: |
          python - <<'PY'
          from pathlib import Path

          dpi = Path('src/tools/mouse/dpi/MouseDpiTest.astro')
          text = dpi.read_text()
          marker = """    .mouse-tool__instruction {\n      min-block-size: 4.3rem;\n    }\n"""
          fixed = marker + """\n    .capture-note {\n      min-block-size: 3.3rem;\n    }\n"""
          if fixed not in text:
              if marker not in text:
                  raise SystemExit('Expected mobile DPI instruction block not found')
              dpi.write_text(text.replace(marker, fixed, 1))
          PY
      - name: Commit DPI stability fix
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/tools/mouse/dpi/MouseDpiTest.astro
            git commit -m "UI: stabilize DPI capture note"
            git push origin HEAD:ui-content-driven-stability
          fi
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-ui-dist
          path: dist
