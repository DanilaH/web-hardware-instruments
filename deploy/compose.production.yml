name: hardwareinspect

services:
  hardwareinspect-web:
    container_name: hardwareinspect-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.production
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
    name: web_proxy
