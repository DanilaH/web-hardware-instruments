name: Mouse DPI visual check

on:
  pull_request:

jobs:
  visual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run visual probe
        run: |
          python3 -m http.server 4321 --directory dist >/tmp/hardware-tests-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          export BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node .github/scripts/mouse-dpi-visual-check.tmp.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: mouse-dpi-visual-check
          path: visual-check/*.png
