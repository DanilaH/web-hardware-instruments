name: E1 Visual Checkpoint

on:
  push:
    branches:
      - e1-mouse-foundation

jobs:
  visual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install visual-test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Serve build
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/e1-visual-server.log 2>&1 &
          echo $! > /tmp/e1-visual-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/mouse-tester/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/e1-visual-server.log
          exit 1

      - name: Capture visual states
        run: node scripts/e1-visual.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e1-mouse-tester-visuals
          path: visual-output/
          if-no-files-found: error
