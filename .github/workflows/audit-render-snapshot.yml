name: Audit Render Snapshot

on:
  pull_request:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: hardware-tests-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
