name: Live Production Audit

on:
  pull_request:
    paths:
      - '.github/workflows/live-production-audit.yml'

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install audit dependencies
        run: npm install --no-save --package-lock=false playwright@1.55.0 axe-core@4.10.3
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Decode audit script
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/live-production-audit.mjs
          node --check /tmp/live-production-audit.mjs
      - name: Audit live production
        id: live_audit
        continue-on-error: true
        run: node /tmp/live-production-audit.mjs
      - name: Upload live audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardwareinspect-live-audit
          path: live-audit-artifacts
          if-no-files-found: error
          retention-days: 3
      - name: Enforce P0/P1 gate
        if: steps.live_audit.outcome == 'failure'
        run: exit 1
