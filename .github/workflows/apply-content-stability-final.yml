name: Apply content stability final fixes

on:
  push:
    branches:
      - ui-content-driven-stability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ui-content-driven-stability
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          touch_controller = Path('src/tools/touch/tester/touch-screen-controller.ts')
          text = touch_controller.read_text()
          old_touch = "No touchscreen capability is reported on this device. Open this page on the device you want to test."
          new_touch = "No touchscreen capability reported on this device."
          if old_touch in text:
              touch_controller.write_text(text.replace(old_touch, new_touch))

          dpi = Path('src/tools/mouse/dpi/MouseDpiTest.astro')
          text = dpi.read_text()
          old_dpi = """  @media (max-width: 22rem) {\n    .mouse-tool__status-row {\n      min-block-size: 4.3rem;\n    }\n  }"""
          new_dpi = """  @media (max-width: 22rem) {\n    .mouse-tool__status-row {\n      min-block-size: 4.3rem;\n    }\n\n    .mouse-tool__instruction {\n      min-block-size: 5.75rem;\n    }\n  }"""
          if old_dpi in text:
              dpi.write_text(text.replace(old_dpi, new_dpi))
          elif new_dpi not in text:
              raise SystemExit('Expected DPI media block not found')

          touch = Path('src/tools/touch/tester/TouchScreenTest.astro')
          text = touch.read_text()
          old_note = """  .touch-tool__fullscreen-note {\n    color: var(--color-muted);\n    font-size: 0.76rem;\n  }"""
          new_note = """  .touch-tool__fullscreen-note {\n    min-block-size: 1.15rem;\n    flex: 0 0 100%;\n    color: var(--color-muted);\n    font-size: 0.76rem;\n  }"""
          if old_note in text:
              text = text.replace(old_note, new_note)
          elif new_note not in text:
              raise SystemExit('Expected fullscreen note block not found')

          old_hands = """    .hands-off {\n      align-items: stretch;\n      flex-direction: column;\n      gap: var(--space-2);\n    }"""
          new_hands = """    .hands-off {\n      align-items: stretch;\n      flex-direction: column;\n      gap: var(--space-2);\n    }\n\n    .hands-off p {\n      min-block-size: 3.6rem;\n    }"""
          if old_hands in text:
              text = text.replace(old_hands, new_hands)
          elif new_hands not in text:
              raise SystemExit('Expected hands-off mobile block not found')
          touch.write_text(text)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/touch/tester/touch-screen-controller.ts src/tools/touch/tester/TouchScreenTest.astro src/tools/mouse/dpi/MouseDpiTest.astro
          git commit -m "UI: stabilize touch dynamic actions"
          git push origin HEAD:ui-content-driven-stability
